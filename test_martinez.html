<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martinez Integration Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        #output {
            background: #000;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
        }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #88ccff; }
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h1>Martinez Integration Test</h1>
    <p>Testing Martinez polygon clipping integration for intersection crossfade</p>
    
    <div>
        <button onclick="testMartinezLibrary()">Test 1: Martinez Library</button>
        <button onclick="testBasicIntersection()">Test 2: Basic Intersection</button>
        <button onclick="testCrossfadePosition()">Test 3: Crossfade Position</button>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearOutput()">Clear</button>
    </div>

    <div id="output">Results will appear here...</div>

    <!-- Load Martinez -->
    <script src="martinez.min.js"></script>
    <!-- Load spatial_audio.js for GPSUtils -->
    <script src="spatial_audio.js"></script>

    <script>
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
            log('Output cleared', 'info');
        }

        function testMartinezLibrary() {
            log('=== Test 1: Martinez Library Check ===', 'info');
            
            if (typeof martinez === 'undefined') {
                log('❌ FAIL: Martinez library not loaded', 'error');
                return false;
            }
            
            log('✅ PASS: Martinez library loaded', 'success');
            log(`   Martinez methods: ${Object.keys(martinez).join(', ')}`, 'info');
            return true;
        }

        function testBasicIntersection() {
            log('=== Test 2: Basic Intersection ===', 'info');
            
            if (typeof GPSUtils === 'undefined') {
                log('❌ FAIL: GPSUtils not loaded', 'error');
                return false;
            }

            if (typeof GPSUtils.martinezIntersection !== 'function') {
                log('❌ FAIL: martinezIntersection method not found', 'error');
                return false;
            }

            // Test with two overlapping squares
            // Martinez expects polygons as array of points
            const poly1 = [
                {lat: 0, lng: 0},
                {lat: 0, lng: 2},
                {lat: 2, lng: 2},
                {lat: 2, lng: 0}
            ];

            const poly2 = [
                {lat: 1, lng: 1},
                {lat: 1, lng: 3},
                {lat: 3, lng: 3},
                {lat: 3, lng: 1}
            ];

            try {
                const intersection = GPSUtils.martinezIntersection(poly1, poly2);
                
                if (!intersection) {
                    log('❌ FAIL: No intersection computed (expected overlap)', 'error');
                    log('   Note: Martinez expects [[[lng, lat], ...]] format', 'info');
                    return false;
                }

                log(`✅ PASS: Intersection computed with ${intersection.length} vertices`, 'success');
                log(`   Intersection polygon: ${JSON.stringify(intersection)}`, 'info');
                return true;
            } catch (error) {
                log(`❌ FAIL: Error computing intersection: ${error.message}`, 'error');
                return false;
            }
        }

        function testCrossfadePosition() {
            log('=== Test 3: Crossfade Position ===', 'info');
            
            if (typeof GPSUtils === 'undefined') {
                log('❌ FAIL: GPSUtils not loaded', 'error');
                return false;
            }

            if (typeof GPSUtils.getCrossfadePosition !== 'function') {
                log('❌ FAIL: getCrossfadePosition method not found', 'error');
                return false;
            }

            // Create a simple square intersection (100m x 100m)
            const intersection = [
                {lat: 52.52, lng: 13.40},
                {lat: 52.52, lng: 13.42},
                {lat: 52.53, lng: 13.42},
                {lat: 52.53, lng: 13.40}
            ];

            // Test position at center, traveling east (90°)
            try {
                const centerLat = 52.525;
                const centerLng = 13.41;
                const position = GPSUtils.getCrossfadePosition(centerLat, centerLng, intersection, 90);
                
                if (position < 0 || position > 1) {
                    log(`❌ FAIL: Position ${position} out of range [0, 1]`, 'error');
                    return false;
                }

                log(`✅ PASS: Crossfade position = ${position.toFixed(3)} (expected ~0.5 for center)`, 'success');
                
                // Test at entry edge (west side, should be ~0)
                const entryLat = 52.525;
                const entryLng = 13.401;  // Near west edge
                const entryPos = GPSUtils.getCrossfadePosition(entryLat, entryLng, intersection, 90);
                log(`   Entry edge position = ${entryPos.toFixed(3)} (expected ~0)`, 'info');
                
                // Test at exit edge (east side, should be ~1)
                const exitLat = 52.525;
                const exitLng = 13.419;  // Near east edge
                const exitPos = GPSUtils.getCrossfadePosition(exitLat, exitLng, intersection, 90);
                log(`   Exit edge position = ${exitPos.toFixed(3)} (expected ~1)`, 'info');
                
                // Verify entry < exit
                if (entryPos < exitPos) {
                    log(`   ✅ Entry (${entryPos.toFixed(3)}) < Exit (${exitPos.toFixed(3)}) - correct order`, 'success');
                } else {
                    log(`   ⚠️  Entry (${entryPos.toFixed(3)}) >= Exit (${exitPos.toFixed(3)}) - unexpected`, 'error');
                }
                
                return true;
            } catch (error) {
                log(`❌ FAIL: Error computing crossfade position: ${error.message}`, 'error');
                return false;
            }
        }

        function testRaySegmentIntersection() {
            log('=== Test 4: Ray-Segment Intersection ===', 'info');
            
            if (typeof GPSUtils === 'undefined') {
                log('❌ FAIL: GPSUtils not loaded', 'error');
                return false;
            }

            if (typeof GPSUtils.raySegmentIntersection !== 'function') {
                log('❌ FAIL: raySegmentIntersection method not found', 'error');
                return false;
            }

            // Simpler test: Ray traveling East, segment directly in path
            const rayOrigin = {lat: 52.52, lng: 13.40};
            const rayDirection = 90; // East

            // Segment crosses ray at x=50m: vertical line from y=+10m to y=-10m
            // At latitude 52.52°:
            //   1° longitude = 111000 * cos(52.52°) ≈ 67,500m
            //   50m East = 50/67500 ≈ 0.00074°
            //   10m North = 10/111000 ≈ 0.00009°
            const segmentStart = {lat: 52.52009, lng: 13.40074};  // 50m E, 10m N
            const segmentEnd = {lat: 52.51991, lng: 13.40074};    // 50m E, 10m S

            // Debug: Show segment position in meters
            const startM = GPSUtils.toMeters(segmentStart.lat, segmentStart.lng, rayOrigin.lat, rayOrigin.lng);
            const endM = GPSUtils.toMeters(segmentEnd.lat, segmentEnd.lng, rayOrigin.lat, rayOrigin.lng);
            log(`   Segment in meters: (${startM.x.toFixed(1)}m, ${startM.z.toFixed(1)}m) to (${endM.x.toFixed(1)}m, ${endM.z.toFixed(1)}m)`, 'info');

            try {
                const intersection = GPSUtils.raySegmentIntersection(rayOrigin, rayDirection, segmentStart, segmentEnd);
                
                if (!intersection) {
                    log('❌ FAIL: No intersection found', 'error');
                    return false;
                }

                log(`✅ PASS: Ray-segment intersection at distance ${intersection.distance.toFixed(2)}m`, 'success');
                return true;
            } catch (error) {
                log(`❌ FAIL: Error computing ray-segment intersection: ${error.message}`, 'error');
                return false;
            }
        }

        function testEqualPowerCrossfade() {
            log('=== Test 5: Equal-Power Crossfade Curve ===', 'info');
            
            // Test equal-power crossfade formula
            const testPositions = [0, 0.25, 0.5, 0.75, 1.0];
            
            log('Testing equal-power crossfade (cos/sin curves):', 'info');
            log('Position | Origin | Dest   | Power Sum', 'info');
            log('---------|--------|--------|----------', 'info');
            
            for (const pos of testPositions) {
                const originWeight = Math.cos(pos * Math.PI / 2);
                const destWeight = Math.sin(pos * Math.PI / 2);
                const powerSum = Math.sqrt(originWeight * originWeight + destWeight * destWeight);
                
                log(`${pos.toFixed(2)}     | ${originWeight.toFixed(3)}  | ${destWeight.toFixed(3)}  | ${powerSum.toFixed(3)}`, 'info');
            }
            
            log('✅ PASS: Equal-power crossfade maintains constant power (~1.0)', 'success');
            return true;
        }

        function runAllTests() {
            clearOutput();
            log('🚀 Running all Martinez integration tests...\n', 'info');
            
            const results = [];
            results.push(testMartinezLibrary());
            results.push(testBasicIntersection());
            results.push(testCrossfadePosition());
            results.push(testRaySegmentIntersection());
            results.push(testEqualPowerCrossfade());
            
            const passed = results.filter(r => r).length;
            const total = results.length;
            
            log(`\n${'='.repeat(50)}`, 'info');
            log(`📊 Test Results: ${passed}/${total} tests passed`, passed === total ? 'success' : 'error');
            
            if (passed === total) {
                log('✅ All tests passed! Martinez integration is working correctly.', 'success');
                log('\n📝 Next steps:', 'info');
                log('   1. Deploy to test server: & .\\deploy.ps1', 'info');
                log('   2. Test on mobile with overlapping polygon areas', 'info');
                log('   3. Listen for smooth crossfade in intersection zones', 'info');
            } else {
                log('❌ Some tests failed. Check errors above.', 'error');
            }
        }

        // Auto-run tests on page load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache and Reload</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Clear Service Worker Cache and Reload</h1>
    <button id="clearCacheBtn">Clear Cache and Reload</button>
    <div id="status"></div>

    <script>
        document.getElementById('clearCacheBtn').addEventListener('click', async function() {
            const status = document.getElementById('status');
            status.textContent = 'Clearing service worker cache...';
            
            try {
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    
                    for (const registration of registrations) {
                        await registration.unregister();
                        console.log('Service worker unregistered:', registration.scope);
                    }
                    
                    // Clear all caches
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        console.log('Cache deleted:', cacheName);
                    }
                }
                
                status.textContent = 'Cache cleared. Reloading page...';
                
                // Reload the page after a short delay
                setTimeout(() => {
                    window.location.reload(true);
                }, 1000);
                
            } catch (error) {
                console.error('Error clearing cache:', error);
                status.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
